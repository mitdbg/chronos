[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronos-code"
version = "0.1.0"
description = "A transactional CLI coding agent built on Chronos"
readme = "PLAN.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "langchain-chronos",
    "langchain-core>=0.3.0",
    "litellm>=1.0.0",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "click>=8.0",
    "tiktoken>=0.5.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.0",
]
mcp = [
    "mcp[cli]>=1.9.0",
]

[project.scripts]
chronos-code = "chronos_code.cli:main"
chronos-code-mcp = "chronos_code.mcp_server.cli:main"
chronos-code-mcp-bootstrap = "chronos_code.mcp_server.bootstrap_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["chronos_code*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
langchain-chronos = { workspace = true }
