[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "chronos-core"
version = "0.1.0"
description = "Core Transactional Agent Runtime primitives and shims"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "psycopg[binary]>=3.1",
  "sqlglot[c]>=25",
]

[project.optional-dependencies]
duckdb = [
  "duckdb>=1.0",
]
mcp = [
  "mcp[cli]>=1.9.0",
  "tomli>=2.0; python_version < '3.11'",
]
test = [
  "boto3>=1.35",
  "duckdb>=1.0",
  "mcp[cli]>=1.9.0",
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
  "tomli>=2.0; python_version < '3.11'",
]
fuse = [
]

[project.scripts]
chronos-mcp = "chronos_core.mcp.cli:main"
chronos-mcp-deploy-codex = "chronos_core.mcp.deploy_codex:main"
chronos-lake = "chronos_core.lake.cli:main"

[tool.scikit-build]
wheel.packages = ["src/chronos_core"]
cmake.source-dir = "."
build-dir = "build/{wheel_tag}"
