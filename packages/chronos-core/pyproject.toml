[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "chronos-core"
version = "0.1.0"
description = "Core Transactional Agent Runtime primitives and shims"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "psycopg[binary]>=3.1",
  "sqlglot[c]>=25",
]

[project.optional-dependencies]
duckdb = [
  "duckdb>=1.0",
]
test = [
  "duckdb>=1.0",
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
]
fuse = [
]

[tool.scikit-build]
wheel.packages = ["src/chronos_core"]
cmake.source-dir = "."
