[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "janus-code"
version = "0.1.0"
description = "A transactional CLI coding agent built on Janus"
readme = "PLAN.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "langchain-janus",
    "langchain-core>=0.3.0",
    "litellm>=1.0.0",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "click>=8.0",
    "tiktoken>=0.5.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.0",
]
mcp = [
    "mcp[cli]>=1.9.0",
]

[project.scripts]
janus-code = "janus_code.cli:main"
janus-code-mcp = "janus_code.mcp_server.cli:main"
janus-code-mcp-bootstrap = "janus_code.mcp_server.bootstrap_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["janus_code*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
langchain-janus = { workspace = true }
