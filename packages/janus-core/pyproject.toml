[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "janus-core"
version = "0.1.0"
description = "Core Transactional Agent Runtime primitives and shims"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "psycopg[binary]>=3.1",
  "sqlglot>=25",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/janus_core"]
